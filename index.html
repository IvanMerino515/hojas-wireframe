<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hojas de wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9ECEE;
  --panel:#FFFFFF;
  --ink:#1D2830;
  --muted:#5D6B75;
  --line:#CBD3D8;
  --blue:#4F94CF;      /* azul no reproducible */
  --blue-soft:#DCEBF7;
  --paper:#FFFFFF;
  --shadow:0 1px 0 rgba(29,40,48,.08), 0 18px 40px -18px rgba(29,40,48,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A1F; --panel:#1C242A; --ink:#E6ECEF; --muted:#93A2AC;
    --line:#2E3A42; --blue:#7DB6E6; --blue-soft:#1F3344; --paper:#F4F6F7;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#141A1F; --panel:#1C242A; --ink:#E6ECEF; --muted:#93A2AC;
  --line:#2E3A42; --blue:#7DB6E6; --blue-soft:#1F3344; --paper:#F4F6F7;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;
}
.app{
  display:grid;grid-template-columns:minmax(300px,360px) 1fr;
  min-height:100vh;
}
aside{
  background:var(--panel);border-right:1px solid var(--line);
  padding:28px 26px 32px;display:flex;flex-direction:column;gap:22px;
}
h1{
  font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;
  font-weight:700;font-size:30px;line-height:1.02;letter-spacing:-.02em;margin:0;
}
h1 span{display:block;color:var(--blue)}
.lede{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:34ch}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.lbl{
  font-weight:600;font-size:13px;margin-bottom:8px;padding:0;display:block;
}
.seg{
  display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;
}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{
  display:block;text-align:center;padding:7px 6px;border-radius:7px;font-size:13.5px;
  color:var(--muted);transition:background .15s,color .15s;
}
.seg input:checked + span{background:var(--blue-soft);color:var(--ink);font-weight:600}
.seg input:focus-visible + span{outline:2px solid var(--blue);outline-offset:1px}
.sheet-switch .seg span{padding:10px 6px;font-size:14.5px}

.count{display:flex;align-items:center;gap:14px}
.count output{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:40px;
  line-height:1;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums;
}
.count input[type=range]{flex:1;accent-color:var(--blue)}
.count small{color:var(--muted);font-size:12.5px;display:block}

.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.checks input{accent-color:var(--blue);width:16px;height:16px;margin:0}

input[type=text],input[type=number]{
  width:100%;font:inherit;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;
}
input[type=text]:focus-visible,input[type=number]:focus-visible,input[type=range]:focus-visible,.checks input:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;
}
.row2{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:end}

.actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
button{
  font:inherit;font-weight:600;border-radius:10px;padding:12px 14px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:var(--panel);
}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted);min-height:1.2em;margin:0}

main{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 28px;gap:14px;min-width:0;
}
.paper{
  background:var(--paper);box-shadow:var(--shadow);
  width:min(100%, calc((100vh - 120px) * var(--ratio)));
  aspect-ratio:var(--ratio);
  transition:aspect-ratio .2s;
}
.paper svg{display:block;width:100%;height:100%}
.meta{color:var(--muted);font-size:13px;text-align:center}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);order:2}
  main{order:1;padding:20px 16px}
  .paper{width:min(100%, 520px)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Hojas de wireframe<span>para lápiz</span></h1>
      <p class="lede">Plantillas A4 en vector para bocetar pantallas a mano. Ajusta, previsualiza y descarga el PDF.</p>
    </header>

    <fieldset class="sheet-switch">
      <legend>Hoja</legend>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="sheet" value="mobile" checked><span>Móvil</span></label>
        <label><input type="radio" name="sheet" value="desktop"><span>Escritorio</span></label>
      </div>
    </fieldset>

    <div>
      <label class="lbl" for="count">Dispositivos por A4</label>
      <div class="count">
        <output id="countOut" for="count">6</output>
        <div style="flex:1">
          <input id="count" type="range" min="1" max="16" value="6" style="width:100%">
          <small id="countHint">de 1 a 16</small>
        </div>
      </div>
    </div>

    <fieldset>
      <legend>Orientación</legend>
      <div class="seg">
        <label><input type="radio" name="orient" value="auto" checked><span>Automática</span></label>
        <label><input type="radio" name="orient" value="p"><span>Vertical</span></label>
        <label><input type="radio" name="orient" value="l"><span>Horizontal</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Fondo de pantalla</legend>
      <div class="seg" id="bgSeg">
        <label><input type="radio" name="bg" value="none"><span>Liso</span></label>
        <label><input type="radio" name="bg" value="dots" checked><span>Puntos</span></label>
        <label><input type="radio" name="bg" value="grid"><span>Cuadrícula</span></label>
        <label id="colsOpt" hidden><input type="radio" name="bg" value="cols"><span>12 col.</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Color de línea</legend>
      <div class="seg">
        <label><input type="radio" name="color" value="gray" checked><span>Gris</span></label>
        <label><input type="radio" name="color" value="blue"><span>Azul no reproducible</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Detalles</legend>
      <div class="checks">
        <label><input type="checkbox" id="chrome" checked> <span id="chromeLbl">Isla, botones y barra de inicio</span></label>
        <label><input type="checkbox" id="labels" checked> Número y nombre bajo cada pantalla</label>
        <label><input type="checkbox" id="header" checked> Cabecera con proyecto, flujo y fecha</label>
      </div>
    </fieldset>

    <div class="row2">
      <div>
        <label class="lbl" for="project">Nombre del proyecto</label>
        <input id="project" type="text" placeholder="Se deja en blanco si no lo pones" maxlength="60">
      </div>
      <div>
        <label class="lbl" for="pages">Páginas</label>
        <input id="pages" type="number" min="1" max="30" value="1">
      </div>
    </div>

    <div class="actions">
      <button id="dlOne">Descargar PDF de esta hoja</button>
      <button id="dlBoth" class="ghost">Descargar PDF con móvil y escritorio</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </aside>

  <main>
    <div class="paper" id="paper"></div>
    <div class="meta" id="meta"></div>
  </main>
</div>

<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const A4 = {w:210,h:297};
  const PT = 0.3528; // mm por punto

  const palettes = {
    gray: {frame:'#7d8388', soft:'#a7adb2', grid:'#c9cdd0', text:'#8b9196', fill:'#7d8388'},
    blue: {frame:'#5c9fd6', soft:'#8dbde4', grid:'#bcd8ef', text:'#5c9fd6', fill:'#5c9fd6'}
  };

  // Ajustes por tipo de hoja + comunes
  const state = {
    sheet:'mobile',
    mobile:{count:6, orient:'auto', bg:'dots', chrome:true},
    desktop:{count:4, orient:'auto', bg:'cols', chrome:true},
    color:'gray', labels:true, header:true, project:'', pages:1
  };
  const LIMITS = {mobile:16, desktop:9};
  const DEV = {
    mobile:{ratio:2.03, gap:8},
    desktop:{ratio:0.045+0.625, gap:10}
  };

  /* ---------- Maquetación ---------- */
  function fit(kind, n, orient, s){
    const W = orient==='l'?A4.h:A4.w, H = orient==='l'?A4.w:A4.h;
    const m = 12, head = s.header?17:0, labelH = s.labels?8:2;
    const aw = W-2*m, ah = H-2*m-head;
    const {ratio, gap} = DEV[kind];
    let best=null;
    for(let cols=1; cols<=n; cols++){
      const rows = Math.ceil(n/cols);
      const cw = (aw-gap*(cols-1))/cols;
      const ch = (ah-gap*(rows-1))/rows;
      const w = Math.min(cw, (ch-labelH)/ratio);
      if(w>0 && (!best || w>best.w+0.01)) best={cols,rows,w};
    }
    return {...best, W,H,m,head,labelH,aw,ah,gap,ratio,orient};
  }
  function layout(kind, s){
    const cfg = s[kind];
    const n = cfg.count;
    if(cfg.orient!=='auto') return fit(kind,n,cfg.orient,s);
    const p = fit(kind,n,'p',s), l = fit(kind,n,'l',s);
    // preferencia leve: vertical para móvil, horizontal para escritorio
    const bias = kind==='mobile'?1.04:0.96;
    return (l.w > p.w*bias) ? l : p;
  }

  /* ---------- Primitivas (en mm) ---------- */
  function sheetOps(kind, s, startIndex){
    const L = layout(kind, s);
    const pal = palettes[s.color];
    const ops = [];
    const cfg = s[kind];

    if(s.header) drawHeader(ops, L, kind, s, pal);

    const devH = L.w*L.ratio;
    const cellH = devH + L.labelH;
    const totalH = L.rows*cellH + (L.rows-1)*L.gap;
    const y0 = L.m + L.head + (L.ah-totalH)/2;
    let idx = 0;
    for(let r=0;r<L.rows;r++){
      const inRow = Math.min(L.cols, cfg.count - r*L.cols);
      const rowW = inRow*L.w + (inRow-1)*L.gap;
      const x0 = L.m + (L.aw-rowW)/2;
      for(let c=0;c<inRow;c++){
        const x = x0 + c*(L.w+L.gap), y = y0 + r*(cellH+L.gap);
        if(kind==='mobile') drawPhone(ops,x,y,L.w,cfg,pal);
        else drawBrowser(ops,x,y,L.w,cfg,pal);
        if(s.labels) drawLabel(ops,x,y+devH,L.w,startIndex+idx+1,pal);
        idx++;
      }
    }
    return {ops, L};
  }

  function drawHeader(ops, L, kind, s, pal){
    const y = L.m + 7, x = L.m, w = L.aw;
    const title = kind==='mobile' ? 'Wireframes móvil' : 'Wireframes escritorio';
    ops.push({t:'text',x,y,s:title,size:10,color:pal.frame,bold:true});
    const fields = [
      ['Proyecto', 0.30, 0.62, s.project],
      ['Flujo', 0.645, 0.80],
      ['Fecha', 0.825, 0.935],
      ['Hoja', 0.955, 1]
    ];
    // en horizontal hay más sitio; el título ocupa ~26%
    fields.forEach(([lab,a,b,val])=>{
      const fx = x + w*a, fe = x + w*b;
      ops.push({t:'text',x:fx,y,s:lab,size:7,color:pal.text});
      const lx = fx + lab.length*7*PT*0.56 + 1.5;
      ops.push({t:'line',x1:lx,y1:y+0.8,x2:fe,y2:y+0.8,stroke:pal.soft,lw:0.2});
      if(val) ops.push({t:'text',x:lx+1,y:y-0.3,s:val,size:9,color:'#333b41'});
    });
    ops.push({t:'line',x1:x,y1:L.m+11.5,x2:x+w,y2:L.m+11.5,stroke:pal.grid,lw:0.2});
  }

  function drawLabel(ops,x,y,w,n,pal){
    const by = y + 5.6;
    ops.push({t:'text',x,y:by,s:String(n).padStart(2,'0'),size:7,color:pal.text,bold:true});
    ops.push({t:'line',x1:x+5.5,y1:by+0.6,x2:x+w,y2:by+0.6,stroke:pal.soft,lw:0.2});
  }

  // Extensión horizontal de un rect redondeado a la altura yy
  function span(x,y,w,h,r,yy){
    let dx=0;
    const top=y+r, bot=y+h-r;
    if(yy<top){ const d=top-yy; dx = r-Math.sqrt(Math.max(0,r*r-d*d)); }
    else if(yy>bot){ const d=yy-bot; dx = r-Math.sqrt(Math.max(0,r*r-d*d)); }
    return [x+dx, x+w-dx];
  }
  function vspan(x,y,w,h,r,xx){
    const [a,b] = span(y,x,h,w,r,xx); return [a,b];
  }

  function drawBackground(ops,x,y,w,h,r,bg,pal,step){
    if(bg==='dots'){
      const nx=Math.floor(w/step), ny=Math.floor(h/step);
      const ox = x+(w-nx*step)/2, oy=y+(h-ny*step)/2;
      for(let i=0;i<=nx;i++) for(let j=0;j<=ny;j++){
        const px=ox+i*step, py=oy+j*step;
        const [a,b]=span(x,y,w,h,r,py);
        if(px>a+0.6 && px<b-0.6 && py>y+0.6 && py<y+h-0.6)
          ops.push({t:'circle',x:px,y:py,r:0.2,fill:pal.grid});
      }
    } else if(bg==='grid'){
      const nx=Math.floor(w/step), ny=Math.floor(h/step);
      const ox = x+(w-nx*step)/2, oy=y+(h-ny*step)/2;
      for(let j=0;j<=ny;j++){
        const py=oy+j*step; if(py<=y+0.3||py>=y+h-0.3) continue;
        const [a,b]=span(x,y,w,h,r,py);
        ops.push({t:'line',x1:a,y1:py,x2:b,y2:py,stroke:pal.grid,lw:0.1});
      }
      for(let i=0;i<=nx;i++){
        const px=ox+i*step; if(px<=x+0.3||px>=x+w-0.3) continue;
        const [a,b]=vspan(x,y,w,h,r,px);
        ops.push({t:'line',x1:px,y1:a,x2:px,y2:b,stroke:pal.grid,lw:0.1});
      }
    }
  }

  function drawPhone(ops,x,y,w,cfg,pal){
    const h = w*2.03, R = w*0.14, ins = w*0.04;
    const sx=x+ins, sy=y+ins, sw=w-2*ins, sh=h-2*ins, sr=R-ins;
    const step = w>70 ? 5 : 4;
    drawBackground(ops,sx,sy,sw,sh,sr,cfg.bg==='cols'?'dots':cfg.bg,pal,step);
    if(cfg.chrome){
      // botones laterales
      const o=0.7;
      ops.push({t:'line',x1:x+w+o,y1:y+h*0.24,x2:x+w+o,y2:y+h*0.34,stroke:pal.frame,lw:0.6});
      ops.push({t:'line',x1:x-o,y1:y+h*0.20,x2:x-o,y2:y+h*0.25,stroke:pal.frame,lw:0.6});
      ops.push({t:'line',x1:x-o,y1:y+h*0.27,x2:x-o,y2:y+h*0.32,stroke:pal.frame,lw:0.6});
    }
    ops.push({t:'rect',x,y,w,h,r:R,stroke:pal.frame,lw:0.35});
    ops.push({t:'rect',x:sx,y:sy,w:sw,h:sh,r:sr,stroke:pal.soft,lw:0.2});
    if(cfg.chrome){
      const iw=w*0.27, ih=w*0.075;
      ops.push({t:'rect',x:x+(w-iw)/2,y:sy+w*0.03,w:iw,h:ih,r:ih/2,fill:pal.fill});
      const hw=w*0.32;
      ops.push({t:'line',x1:x+(w-hw)/2,y1:sy+sh-w*0.04,x2:x+(w+hw)/2,y2:sy+sh-w*0.04,stroke:pal.frame,lw:Math.max(0.4,w*0.009),cap:true});
    }
  }

  function drawBrowser(ops,x,y,w,cfg,pal){
    const barH = cfg.chrome ? w*0.045 : 0;
    const ch = w*0.625, h = barH+ch, R = Math.max(1, w*0.012);
    const cx=x, cy=y+barH;
    if(cfg.bg==='cols'){
      const m=w*0.05, g=w*0.016, colW=(w-2*m-11*g)/12;
      for(let i=0;i<12;i++){
        const a=cx+m+i*(colW+g);
        ops.push({t:'line',x1:a,y1:cy+0.4,x2:a,y2:cy+ch-0.4,stroke:pal.grid,lw:0.12,dash:[0.8,0.8]});
        ops.push({t:'line',x1:a+colW,y1:cy+0.4,x2:a+colW,y2:cy+ch-0.4,stroke:pal.grid,lw:0.12,dash:[0.8,0.8]});
      }
    } else {
      drawBackground(ops,cx,cy,w,ch,cfg.chrome?0:R,cfg.bg,pal, w>150?5:4);
    }
    ops.push({t:'rect',x,y,w,h,r:R,stroke:pal.frame,lw:0.35});
    if(cfg.chrome){
      ops.push({t:'line',x1:x,y1:y+barH,x2:x+w,y2:y+barH,stroke:pal.frame,lw:0.25});
      const cr=barH*0.13;
      for(let i=0;i<3;i++) ops.push({t:'circle',x:x+barH*0.6+i*barH*0.45,y:y+barH/2,r:cr,stroke:pal.frame,lw:0.2});
      const uh=barH*0.56;
      ops.push({t:'rect',x:x+w*0.2,y:y+(barH-uh)/2,w:w*0.6,h:uh,r:uh/2,stroke:pal.soft,lw:0.2});
    }
  }

  /* ---------- Render SVG ---------- */
  function toSVG(ops,W,H){
    const out=[`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vista previa de la hoja A4"><rect width="${W}" height="${H}" fill="#fff"/>`];
    const f=(n)=>+n.toFixed(3);
    for(const o of ops){
      if(o.t==='rect'){
        out.push(`<rect x="${f(o.x)}" y="${f(o.y)}" width="${f(o.w)}" height="${f(o.h)}" rx="${f(o.r||0)}" fill="${o.fill||'none'}" ${o.stroke?`stroke="${o.stroke}" stroke-width="${o.lw}"`:''}/>`);
      } else if(o.t==='line'){
        out.push(`<line x1="${f(o.x1)}" y1="${f(o.y1)}" x2="${f(o.x2)}" y2="${f(o.y2)}" stroke="${o.stroke}" stroke-width="${o.lw}"${o.dash?` stroke-dasharray="${o.dash.join(' ')}"`:''}${o.cap?' stroke-linecap="round"':''}/>`);
      } else if(o.t==='circle'){
        out.push(`<circle cx="${f(o.x)}" cy="${f(o.y)}" r="${f(o.r)}" fill="${o.fill||'none'}"${o.stroke?` stroke="${o.stroke}" stroke-width="${o.lw}"`:''}/>`);
      } else if(o.t==='text'){
        const t=o.s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
        out.push(`<text x="${f(o.x)}" y="${f(o.y)}" font-family="Helvetica, Arial, sans-serif" font-size="${f(o.size*PT)}" font-weight="${o.bold?700:400}" fill="${o.color}">${t}</text>`);
      }
    }
    out.push('</svg>');
    return out.join('');
  }

  /* ---------- Render PDF ---------- */
  function drawPDF(doc, ops){
    for(const o of ops){
      if(o.t==='rect'){
        if(o.fill) doc.setFillColor(o.fill);
        if(o.stroke){ doc.setDrawColor(o.stroke); doc.setLineWidth(o.lw); }
        const style = o.fill && o.stroke ? 'FD' : (o.fill ? 'F' : 'S');
        if(o.r) doc.roundedRect(o.x,o.y,o.w,o.h,o.r,o.r,style);
        else doc.rect(o.x,o.y,o.w,o.h,style);
      } else if(o.t==='line'){
        doc.setDrawColor(o.stroke); doc.setLineWidth(o.lw);
        doc.setLineCap(o.cap?'round':'butt');
        if(o.dash) doc.setLineDashPattern(o.dash,0);
        doc.line(o.x1,o.y1,o.x2,o.y2);
        if(o.dash) doc.setLineDashPattern([],0);
      } else if(o.t==='circle'){
        if(o.fill){ doc.setFillColor(o.fill); doc.circle(o.x,o.y,o.r,'F'); }
        else { doc.setDrawColor(o.stroke); doc.setLineWidth(o.lw); doc.circle(o.x,o.y,o.r,'S'); }
      } else if(o.t==='text'){
        doc.setFont('helvetica', o.bold?'bold':'normal');
        doc.setFontSize(o.size); doc.setTextColor(o.color);
        doc.text(o.s,o.x,o.y);
      }
    }
  }

  function buildPDF(kinds){
    const { jsPDF } = window.jspdf;
    let doc=null, n={mobile:0,desktop:0};
    for(const kind of kinds){
      for(let p=0;p<state.pages;p++){
        const {ops,L} = sheetOps(kind, state, n[kind]);
        n[kind]+=state[kind].count;
        if(!doc) doc = new jsPDF({orientation:L.orient, unit:'mm', format:'a4'});
        else doc.addPage('a4', L.orient);
        drawPDF(doc, ops);
      }
    }
    doc.setProperties({title:'Hojas de wireframe', creator:'Hojas de wireframe'});
    return doc;
  }

  /* ---------- Descarga ---------- */
  let downloads, standalone = !(window.claude && typeof window.claude.use==='function');
  if(!standalone){
    window.claude.use('downloads').then(d=>{ downloads=d; if(!d) disableDownloads(); });
  }
  function disableDownloads(){
    $('#dlOne').disabled = true; $('#dlBoth').disabled = true;
    setStatus('La descarga no está disponible en esta vista.');
  }
  function setStatus(t){ $('#status').textContent = t; }

  async function download(kinds){
    if(!window.jspdf){ setStatus('El generador de PDF no ha cargado. Recarga la página.'); return; }
    const doc = buildPDF(kinds);
    const slug = (state.project||'wireframes').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'wireframes';
    const suffix = kinds.length>1 ? 'movil-escritorio' : (kinds[0]==='mobile'?'movil':'escritorio');
    const filename = `${slug}-${suffix}.pdf`;
    if(standalone){ doc.save(filename); setStatus('PDF descargado.'); return; }
    if(!downloads){ disableDownloads(); return; }
    try{
      await downloads.save({filename, data: doc.output('blob')});
      setStatus('PDF descargado.');
    }catch(e){
      const c = e && e.code;
      if(c==='declined') setStatus('Descarga cancelada.');
      else if(c==='rate_limited') setStatus('Ya hay una descarga pendiente. Confírmala o espera un momento.');
      else disableDownloads();
    }
  }
  $('#dlOne').addEventListener('click',()=>download([state.sheet]));
  $('#dlBoth').addEventListener('click',()=>download(['mobile','desktop']));

  /* ---------- UI ---------- */
  function syncControls(){
    const k=state.sheet, cfg=state[k];
    const r=$('#count'); r.max=LIMITS[k]; r.value=cfg.count;
    $('#countOut').textContent=cfg.count;
    $('#countHint').textContent=`de 1 a ${LIMITS[k]}`;
    document.querySelector(`input[name=orient][value="${cfg.orient}"]`).checked=true;
    $('#colsOpt').hidden = k!=='desktop';
    document.querySelector(`input[name=bg][value="${cfg.bg}"]`).checked=true;
    $('#chrome').checked=cfg.chrome;
    $('#chromeLbl').textContent = k==='mobile' ? 'Isla, botones y barra de inicio' : 'Barra del navegador';
  }
  function render(){
    const {ops,L}=sheetOps(state.sheet,state,0);
    const paper=$('#paper');
    paper.style.setProperty('--ratio', `${L.W}/${L.H}`);
    paper.innerHTML=toSVG(ops,L.W,L.H);
    const devW = Math.round(L.w), devH = Math.round(L.w*L.ratio);
    const total = state.pages>1 ? `, ${state.pages} páginas` : '';
    $('#meta').textContent = `A4 ${L.orient==='l'?'horizontal':'vertical'}, ${L.cols}×${L.rows}, cada pantalla mide ${devW}×${devH} mm${total}`;
  }
  document.querySelectorAll('input[name=sheet]').forEach(i=>i.addEventListener('change',e=>{state.sheet=e.target.value;syncControls();render();}));
  $('#count').addEventListener('input',e=>{state[state.sheet].count=+e.target.value;$('#countOut').textContent=e.target.value;render();});
  document.querySelectorAll('input[name=orient]').forEach(i=>i.addEventListener('change',e=>{state[state.sheet].orient=e.target.value;render();}));
  document.querySelectorAll('input[name=bg]').forEach(i=>i.addEventListener('change',e=>{state[state.sheet].bg=e.target.value;render();}));
  document.querySelectorAll('input[name=color]').forEach(i=>i.addEventListener('change',e=>{state.color=e.target.value;render();}));
  $('#chrome').addEventListener('change',e=>{state[state.sheet].chrome=e.target.checked;render();});
  $('#labels').addEventListener('change',e=>{state.labels=e.target.checked;render();});
  $('#header').addEventListener('change',e=>{state.header=e.target.checked;render();});
  $('#project').addEventListener('input',e=>{state.project=e.target.value.trim();render();});
  $('#pages').addEventListener('input',e=>{const v=Math.max(1,Math.min(30,parseInt(e.target.value)||1));state.pages=v;render();});

  syncControls(); render();
})();
</script>
</body>
</html>
